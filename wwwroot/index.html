<!doctype html>
<html class="no-js" lang="pl">

<head>
  <meta charset="utf-8">
  <title>Pizzeria KNK</title>
  <meta name="description" content="">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta property="og:title" content="">
  <meta property="og:type" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">

  <link rel="manifest" href="site.webmanifest">
  <link rel="apple-touch-icon" href="icon.png">
  <!-- Place favicon.ico in the root directory -->

  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/main.css">

  <meta name="theme-color" content="#fafafa">
</head>

<body>
    <button id="reset-btn" type="button" onclick="reset_menu()">↻</button>
    <h1>Pizzeria <span style="color: #ff6f00; font-size: 125%">KNK</span></h1>
    <script src="js/vendor/modernizr-3.11.2.min.js"></script>
    <script src="js/plugins.js"></script>
    <script src="js/main.js"></script>
    <form action="javascript:show_menu(this.menuBut.value)" method="get">
        <button type="submit" id="menuBut" value="/api/pizza/menu">Menu</button>
        <button type="button" id="doc-button">
            <a id="swagger" href="/swagger/index.html#/Pizza">Documentation</a>
        </button>
        <button id="log-in-out" type="button" onclick="login_as_cook();">Pizzaiolo</button>
    </form>
    <div id="Menu_div"></div>
<div id="add-pizza-section" class="cook-only">
    <button class="cook-only" type="button" onclick="open_add_pizza_modal()">New Pizza</button>
</div>


<!-- Modal do dodawania pizzy -->
<div id="add-pizza-modal" class="modal">
    <div class="modal-content">
        <span class="modal-close" onclick="close_add_pizza_modal()">&times;</span>
        <h2>Nuova Pizza</h2>
        <form id="add-pizza-form">
            <div class="form-group">
                <label for="pizza-name">Nome (Nazwa):</label>
                <input type="text" id="pizza-name" name="name" required>
            </div>
            <div class="form-group">
                <label for="pizza-cost">Prezzo (Cena):</label>
                <input type="number" id="pizza-cost" name="cost" step="0.01" min="0" required>
            </div>
            <div class="form-group">
                <label for="pizza-description">Descrizione (Opis):</label>
                <textarea id="pizza-description" name="description" rows="3" required></textarea>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="close_add_pizza_modal()">Jednak nie</button>
                <button type="submit" class="btn btn-primary">OK</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal do potwierdzenia usunięcia -->
<div id="delete-confirm-modal" class="modal">
    <div class="modal-content modal-small">
        <h2>Conferma eliminazione</h2>
        <p id="delete-message">Chcesz wyrzucić taką świetną pizzę?</p>
        <div class="form-actions">
            <button type="button" class="btn btn-secondary" onclick="close_delete_modal()">No</button>
            <button type="button" class="btn btn-danger" onclick="confirm_delete()">Sì</button>
        </div>
    </div>
</div>

</body>

</html>
